# ==============================================================================
# Configuração do Nginx Host (Hostinger VPS KVM 2)
# Arquivo sugerido no servidor: /etc/nginx/sites-available/vortex-auto.conf
# ==============================================================================

server {
    listen 80;
    # Domínios registrados para a aplicação
    server_name vortexauto.com.br www.vortexauto.com.br;

    # Limite de upload para fotos de peças, avarias e documentos
    client_max_body_size 50M;

    location / {
        # Encaminha as requisições para a porta do contêiner vortex-web
        proxy_pass http://127.0.0.1:3080;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Configurações de timeout para relatórios e uploads pesados
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
