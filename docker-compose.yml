services:
  # -------------------------------------------------------------
  # Banco de Dados Relacional - PostgreSQL 18 (DOC-015)
  # -------------------------------------------------------------
  vortex-db:
    image: postgres:17-alpine
    container_name: vortex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cmbp034349}
      POSTGRES_DB: ${POSTGRES_DB:-vortex_auto}
    ports:
      - "5432:5432"
    volumes:
      - vortex_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-vortex_auto}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vortex-net

  # -------------------------------------------------------------
  # Backend API - Fastify + Prisma + Multi-Tenant (DOC-012/013)
  # -------------------------------------------------------------
  vortex-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: vortex-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3333
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-cmbp034349}@vortex-db:5432/${POSTGRES_DB:-vortex_auto}?schema=public
      JWT_SECRET: ${JWT_SECRET:-vortex_auto_super_secret_jwt_key_prod_2026}
    ports:
      - "3333:3333"
    depends_on:
      vortex-db:
        condition: service_healthy
    networks:
      - vortex-net

  # -------------------------------------------------------------
  # Frontend Web - React + Vite + Nginx SPA (DOC-014)
  # -------------------------------------------------------------
  vortex-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: vortex-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - vortex-api
    networks:
      - vortex-net

networks:
  vortex-net:
    driver: bridge

volumes:
  vortex_pgdata:
    driver: local
